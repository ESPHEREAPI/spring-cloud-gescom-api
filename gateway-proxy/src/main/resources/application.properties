spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
spring.config.import=configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:9101}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# Configuration du serveur

# ===== CONFIGURATION CORS UNIQUE ET OPTIMIS\u00c9E =====
# Filtre pour \u00e9viter la duplication des headers CORS
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_UNIQUE

# Configuration CORS globale - UNE SEULE CONFIGURATION
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# \u2705 CORS Configuration - SYNTAXE CORRIG\u00c9E
# \u2705 AJOUT: Acc\u00e8s sp\u00e9cifique pour les IPs 192.168.123.175, 192.168.1.4 et 77.68.94.193
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://easycom-app:*,http://192.168.123.*:*,http://192.168.1.*:*,https://192.168.123.*:*,https://192.168.1.*:*,http://77.68.94.*:*,https://77.68.94.*:*,http://localhost:8091,http://localhost:4200,http://192.168.123.175,https://192.168.123.175,http://192.168.123.175:*,https://192.168.123.175:*,http://192.168.1.4,https://192.168.1.4,http://192.168.1.4:*,https://192.168.1.4:*,http://77.68.94.193,https://77.68.94.193,http://77.68.94.193:*,https://77.68.94.193:*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,Accept,X-Requested-With,Cache-Control
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=Authorization,Content-Type,Accept
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# ===== CONFIGURATION DES ROUTES =====
# Route 1: Microservice Produits
spring.cloud.gateway.routes[0].id=microservice-produits
#mode dev 
spring.cloud.gateway.routes[0].uri=http://127.0.0.1:9001
# Mode PRODUCTION - Utilisez l'IP publique ou Docker
#spring.cloud.gateway.routes[0].uri=http://77.68.94.193:9001
# Mode Docker (RECOMMAND\u00c9 pour production)
#spring.cloud.gateway.routes[0].uri=lb://MICROSERVICE-PRODUITS
#mode Docker
#spring.cloud.gateway.routes[0].uri=lb://MICROSERVICE-PRODUITS
spring.cloud.gateway.routes[0].predicates[0]=Path=/gateway-proxy/api/microservice-produits/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2

# Route 2: Microservice Exp\u00e9dition
spring.cloud.gateway.routes[1].id=microservice-expedition
spring.cloud.gateway.routes[1].uri=http://localhost:9006
spring.cloud.gateway.routes[1].predicates[0]=Path=/gateway-proxy/suivi/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2

# Route 3: Microservice Admin
spring.cloud.gateway.routes[2].id=microservice-admin
#Pour mode  Dev
spring.cloud.gateway.routes[2].uri=http://localhost:9008
#pour mode Docker 
#spring.cloud.gateway.routes[2].uri=lb://MICROSERVICE-ADMIN

spring.cloud.gateway.routes[2].predicates[0]=Path=/gateway-proxy/api/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[2].filters[1]=PreserveHostHeader

# ===== CONFIGURATION PERFORMANCE =====
# Timeout optimis\u00e9s
#spring.cloud.gateway.httpclient.connect-timeout=15000
#spring.cloud.gateway.httpclient.response-timeout=30s
# \u2705 Mode PRODUCTION - Timeouts augment\u00e9s (activez ces lignes)
spring.cloud.gateway.httpclient.connect-timeout=60000
spring.cloud.gateway.httpclient.response-timeout=120s

# Pool de connexions
spring.cloud.gateway.httpclient.pool.max-idle-time=30s
spring.cloud.gateway.httpclient.pool.max-life-time=120s
spring.cloud.gateway.httpclient.pool.type=ELASTIC
spring.cloud.gateway.httpclient.pool.max-connections=500


# \u2705 AJOUT CRITIQUE: Configuration Ribbon/LoadBalancer pour \u00e9viter timeouts
# D\u00e9commentez en mode Docker/Eureka
spring.cloud.loadbalancer.ribbon.enabled=false
ribbon.ReadTimeout=120000
ribbon.ConnectTimeout=60000
ribbon.MaxAutoRetries=1
ribbon.MaxAutoRetriesNextServer=1


# \u2705 AJOUT: Configuration Resilience4j pour retry automatique
resilience4j.circuitbreaker.instances.default.sliding-window-size=10
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=30s

# ===== MONITORING =====
# Activer les endpoints Actuator
management.endpoints.web.exposure.include=gateway,health,info,refresh
management.endpoint.gateway.enabled=true

# \u2705 AJOUT: Meilleure configuration Actuator
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ===== LOGGING =====
# Configuration de logging pour debugging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.reactor.netty=INFO


# Spring Security (comment\u00e9)
#spring.security.user.name=jiatouz
#spring.security.user.password=jiatou14101987


logging.level.org.springframework.web.cors: DEBUG
    
logging.level.org.springframework.cloud.gateway: DEBUG


# Logs d\u00e9taill\u00e9s du Gateway
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=DEBUG
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=DEBUG
logging.level.org.springframework.web.reactive=DEBUG

# Logs des requ\u00eates HTTP
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.cloud.gateway.filter.NettyRoutingFilter=DEBUG

# Logs CORS
logging.level.org.springframework.web.cors=DEBUG

# Format des logs plus d\u00e9taill\u00e9
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Ajoutez dans votre application.properties
logging.level.org.springframework.cloud.gateway.filter.NettyWriteResponseFilter=TRACE
logging.level.org.springframework.web.reactive=DEBUG
server.ssl.enabled=false
