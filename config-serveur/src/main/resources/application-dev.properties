# Profil dev (local, une seule machine) : le config-server lit le depot
# cloud-config-gescom directement depuis le disque local (pas GitHub) -
# permet de tester un changement de config avec un simple `git commit` local,
# sans avoir besoin de le pousser sur GitHub.
#
# cloud-config-gescom est un sous-module git (gitlink) - JGit n'ouvre pas
# proprement ce type de depot en pointant directement dessus. On pointe donc
# sur le depot parent (qui, lui, est un repertoire git normal) et on restreint
# la recherche au sous-dossier via search-paths.
#
# Chemin du depot parent, surchargeable via CONFIG_LOCAL_GIT_PATH si le poste
# de developpement a une autre arborescence.
spring.cloud.config.server.git.uri=${CONFIG_LOCAL_GIT_PATH:file:///E:/ProjetSpringBoot/spring-cloud-gescom-api}
spring.cloud.config.server.git.search-paths=cloud-config-gescom
