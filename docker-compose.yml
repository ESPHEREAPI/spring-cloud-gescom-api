# ============================================
# DOCKER COMPOSE - EASYCOM-PRO CORRIGÉ
# ============================================

services:
  # ==========================================
  # BASE DE DONNÉES MYSQL
  # ==========================================
  mysql:
    image: mysql:9.0
    container_name: easycom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definissez MYSQL_ROOT_PASSWORD dans .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-easycom_db}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - easycom-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # CONFIG SERVER
  # ==========================================
  config-server:
    build:
      context: ./config-serveur
      dockerfile: Dockerfile
    container_name: easycom-config-server
    restart: unless-stopped
    ports:
      - "9101:9101"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: git
    networks:
      - easycom-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9101/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================
  # EUREKA SERVER
  # ==========================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: easycom-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_CONFIG_URI: http://config-server:9101
      EUREKA_HOSTNAME: eureka-server
    networks:
      - easycom-network
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ==========================================
  # API GATEWAY
  # ==========================================
  gateway:
    build:
      context: ./gateway-proxy
      dockerfile: Dockerfile
    container_name: easycom-gateway
    restart: unless-stopped
    # Plus expose publiquement (voir service caddy) : seul le reseau
    # docker interne y accede desormais. Reexposer temporairement
    # "8080:8080" ici si un acces direct de diagnostic est necessaire.
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1024m"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_CONFIG_URI: http://config-server:9101
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Definissez CORS_ALLOWED_ORIGINS dans .env}
    networks:
      - easycom-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ==========================================
  # MICROSERVICE PRODUITS
  # ==========================================
  microservice-produits:
    build:
      context: ./microservice-produits
      dockerfile: Dockerfile
    container_name: easycom-produits
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_CONFIG_URI: http://config-server:9101
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/easycom_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_JWTSECRET: ${APP_JWTSECRET:?Definissez APP_JWTSECRET dans .env}
      APP_INTERNAL_SERVICE_SECRET: ${APP_INTERNAL_SERVICE_SECRET:?Definissez APP_INTERNAL_SERVICE_SECRET dans .env}
      APP_LICENCE_ADMIN_BASE_URL: http://microservice-admin:9008
    networks:
      - easycom-network
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9001/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ==========================================
  # MICROSERVICE ADMIN
  # ==========================================
  microservice-admin:
    build:
      context: ./microservice-administration
      dockerfile: Dockerfile
    container_name: easycom-admin
    restart: unless-stopped
    ports:
      - "9008:9008"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_CONFIG_URI: http://config-server:9101
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/easycom_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_JWTSECRET: ${APP_JWTSECRET:?Definissez APP_JWTSECRET dans .env}
      APP_INTERNAL_SERVICE_SECRET: ${APP_INTERNAL_SERVICE_SECRET:?Definissez APP_INTERNAL_SERVICE_SECRET dans .env}
      APP_LICENCE_RSA_PRIVATE_KEY: ${APP_LICENCE_RSA_PRIVATE_KEY:?Definissez APP_LICENCE_RSA_PRIVATE_KEY dans .env}
    volumes:
      # La cle privee RSA de licence vit sur l'hote (jamais dans l'image ni le
      # repo) - montee en lecture seule ici. APP_LICENCE_RSA_PRIVATE_KEY dans
      # .env doit pointer vers le chemin CONTENEUR (/secrets/...), pas le
      # chemin hote.
      - ./secrets:/secrets:ro
    networks:
      - easycom-network
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9008/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ==========================================
  # PHPMYADMIN - Interface Web MySQL
  # ==========================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: easycom-phpmyadmin
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      # PMA_USER/PMA_PASSWORD delibrement absents : les definir bascule
      # phpMyAdmin en auth_type "config" qui connecte automatiquement
      # n'importe quel visiteur en root, sans jamais demander de mot de
      # passe - inacceptable des lors que le port est expose publiquement.
      # Sans eux, l'image reste en mode "cookie" (login manuel a chaque fois).
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - easycom-network
    depends_on:
      mysql:
        condition: service_healthy
        
  # ==========================================
  # FRONTEND ANGULAR
  # ==========================================
  frontend:
    build:
      context: ./web/easycompro-gescom/AdminLTE-3_2_0-angular/adminlte-angular-app
      dockerfile: Dockerfile
    container_name: easycom-frontend
    restart: unless-stopped
    # Plus expose publiquement (voir service caddy) : seul le reseau
    # docker interne y accede desormais. Reexposer temporairement
    # "8081:80" ici si un acces direct de diagnostic est necessaire.
    networks:
      - easycom-network
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================
  # CADDY - TLS/HTTPS, point d'entree public unique
  # ==========================================
  caddy:
    image: caddy:2-alpine
    container_name: easycom-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - easycom-network
    depends_on:
      frontend:
        condition: service_healthy

# ==========================================
# RÉSEAUX
# ==========================================
networks:
  easycom-network:
    driver: bridge
    name: easycom-network

# ==========================================
# VOLUMES PERSISTANTS
# ==========================================
volumes:
  mysql-data:
    name: easycom-mysql-data
  # Certificats Let's Encrypt + etat ACME de Caddy - a conserver entre les
  # redeploiements pour ne pas re-demander un certificat a chaque fois
  # (Let's Encrypt limite le nombre de demandes par domaine/semaine).
  caddy-data:
    name: easycom-caddy-data
  caddy-config:
    name: easycom-caddy-config