spring.application.name=microservice-produits
server.port=9001
spring.cloud.config.uri=http://localhost:9101
management.endpoints.web.exposure.include=*
#management.endpoints.web.exposure.include=info


#Spring Security
#spring.security.user.name=jiatou
#spring.security.user.password=jiatou14101987

logging.level.org.springframework.security=DEBUG
logging.level.sid.mproduits=DEBUG
#Configurations H2
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Niveau de log global
logging.level.root=INFO

# Niveau de log pour votre application
logging.level.sid.service_admin=DEBUG

# Niveau de log pour Spring
logging.level.org.springframework=INFO

# Niveau de log pour Tomcat
logging.level.org.apache.tomcat=DEBUG
logging.level.org.apache.catalina=DEBUG

# Format des logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log dans un fichier
logging.file.name=myapp.log


# Configuration de la source de donn\u00e9es MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/librairie?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.password=DeepWater@2021

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
# Validate schema without creating constraints
#spring.jpa.hibernate.ddl-auto=validate

# Or use update with constraint handling
spring.jpa.properties.hibernate.hbm2ddl.auto=update
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Skip foreign key constraint creation during schema updates
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.hbm2ddl.MultipleLinesSqlCommandExtractor

# Enable debug mode
debug=true
logging.level.org.springframework.transaction=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.mproduits=DEBUG
logging.level.org.springframework.transaction=TRACE








