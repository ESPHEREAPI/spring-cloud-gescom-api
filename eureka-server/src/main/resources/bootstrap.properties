spring.application.name=eureka-server
server.port=8761

#spring.cloud.config.uri=http://localhost:9101
spring.cloud.config.uri=http://localhost:9101

# Bootstrap Configuration pour Eureka Server
spring.application.name=eureka-server

# Configuration du Config Server pour Docker
#spring.cloud.config.uri=http://config-server:9101
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.max-attempts=20
spring.cloud.config.retry.initial-interval=3000
spring.cloud.config.retry.max-interval=10000

# Profile actif
#spring.profiles.active=docker


# \u26a0\ufe0f PROBL\u00c8ME D\u00c9TECT\u00c9: En production (77.68.94.193), changez cette URL
# Mode DEV (local)
#spring.cloud.config.uri=http://localhost:9101
# Mode PRODUCTION (\u00e0 activer pour le serveur en ligne)
spring.cloud.config.uri=http://localhost:9101

# Bootstrap Configuration pour Eureka Server
spring.application.name=eureka-server

# Configuration du Config Server pour Docker
#spring.cloud.config.uri=http://config-server:9101
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.max-attempts=20
spring.cloud.config.retry.initial-interval=3000
spring.cloud.config.retry.max-interval=10000

# Profile actif
#spring.profiles.active=docker

# \u2705 AJOUT CRITIQUE: Configuration Eureka pour production
# D\u00e9commentez ces lignes en production
#eureka.instance.hostname=77.68.94.193
eureka.instance.hostname=127.0.0.1
eureka.instance.prefer-ip-address=true
#eureka.instance.ip-address=77.68.94.193
eureka.instance.ip-address=127.0.0.1
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
#eureka.client.serviceUrl.defaultZone=http://77.68.94.193:8761/eureka/
eureka.client.serviceUrl.defaultZone=http://127.0.0.1:8761/eureka/

# \u2705 AJOUT: Timeouts pour \u00e9viter les blocages au d\u00e9marrage
eureka.server.wait-time-in-ms-when-sync-empty=0
eureka.server.response-cache-update-interval-ms=3000
