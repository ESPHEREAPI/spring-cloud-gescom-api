name: CD - Deploiement production

# Volontairement PAS de trigger automatique sur push : le deploiement reel
# ne part que quand quelqu'un clique "Run workflow" ci-dessous (bouton
# manuel, onglet Actions). Le CI (ci.yml), lui, reste automatique a chaque
# push/PR - c'est la partie "hybride" : integration continue automatique,
# deploiement continu declenche a la main.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deployer sur le serveur
    runs-on: ubuntu-latest
    steps:
      - name: Configurer la cle SSH de deploiement
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Ajouter le serveur aux hotes connus
        run: ssh-keyscan -H ${{ secrets.DEPLOY_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Pull + reconstruire les conteneurs sur le serveur
        run: |
          ssh ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} '
            set -e
            cd ~/easycom
            git fetch origin main
            git reset --hard origin/main
            git submodule update --init --recursive
            docker compose up -d --build
          '

      - name: Verifier que les services sont en sante
        run: |
          ssh ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} '
            cd ~/easycom
            sleep 20
            docker compose ps
          '
