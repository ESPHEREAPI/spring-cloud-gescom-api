# ============================================
# APPLICATION
# ============================================
spring.application.name=microservice-produits
server.port=9001
spring.cloud.config.uri=http://localhost:9101

# ============================================
# TOMCAT \u2014 timeout & threads
# ============================================
server.tomcat.connection-timeout=60000
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.max-connections=8192
server.tomcat.accept-count=100

# ============================================
# HIKARICP \u2014 pool de connexions
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/librairie?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
spring.datasource.username=root
spring.datasource.password=DeepWater@2021
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=ProduitHikariPool

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# Pagination & fetch optimis\u00e9s pour gros volumes
spring.jpa.properties.hibernate.jdbc.fetch_size=200
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Timeout requ\u00eate (en secondes)
spring.jpa.properties.jakarta.persistence.query.timeout=30000
spring.jpa.properties.hibernate.query.timeout=30

# Cache second niveau (optionnel \u2014 activer si Ehcache/Caffeine pr\u00e9sent)
# spring.jpa.properties.hibernate.cache.use_second_level_cache=true
# spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory

# ============================================
# CACHE SPRING (Caffeine recommand\u00e9)
# ============================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# ============================================
# LOGS \u2014 niveaux r\u00e9duits pour la production
# ============================================
spring.output.ansi.enabled=ALWAYS
spring.main.banner-mode=console
logging.file.name=myapp.log
logging.level.root=WARN

# Votre application : gardez DEBUG
logging.level.sid.mproduits=DEBUG
logging.level.com.mproduits=DEBUG

# Spring : INFO seulement
logging.level.org.springframework=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework.orm.jpa=WARN

# Hibernate : WARN (plus de TRACE qui logge chaque ligne SQL)
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Tomcat
logging.level.org.apache.tomcat=WARN
logging.level.org.apache.catalina=WARN

# Jackson
logging.level.com.fasterxml.jackson=WARN

logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){magenta} %clr(%-5level){red} %clr(%logger{36}){cyan} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# MYSQL CONFIG
# ============================================
spring.h2.console.enabled=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# JACKSON
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ============================================
# ACTUATOR
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.health.mail.enabled=false

# ============================================
# TVA
# ============================================
app.produit.tva=19.25