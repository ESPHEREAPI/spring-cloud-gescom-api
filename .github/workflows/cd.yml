name: CD - Deploiement production

# Volontairement PAS de trigger automatique sur push : le deploiement reel
# ne part que quand quelqu'un clique "Run workflow" ci-dessous (bouton
# manuel, onglet Actions). Le CI (ci.yml), lui, reste automatique a chaque
# push/PR - c'est la partie "hybride" : integration continue automatique,
# deploiement continu declenche a la main.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deployer sur le serveur
    runs-on: ubuntu-latest
    steps:
      - name: Configurer la cle SSH de deploiement
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Ajouter le serveur aux hotes connus
        run: ssh-keyscan -H ${{ secrets.DEPLOY_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Pull + reconstruire les conteneurs sur le serveur
        run: |
          ssh ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} '
            set -e
            cd ~/easycom
            git fetch origin main
            git reset --hard origin/main
            echo "--- Commit attendu pour le sous-module template-angular ---"
            git ls-tree HEAD web/easycompro-gescom/AdminLTE-3_2_0-angular/adminlte-angular-app
            git submodule sync --recursive
            git submodule update --init --recursive --force
            echo "--- Commit reellement checkout dans le sous-module ---"
            git -C web/easycompro-gescom/AdminLTE-3_2_0-angular/adminlte-angular-app rev-parse HEAD
            docker compose build --no-cache frontend microservice-admin
            docker compose up -d --build
            # docker compose up -d --build ne recree un conteneur que si SON
            # PROPRE build a change. Le gateway lit sa config CORS une seule
            # fois au demarrage depuis config-server, qui sert cloud-config-gescom
            # (un depot externe, distinct du code du gateway) - si seul ce depot
            # a change, le conteneur gateway (image identique) n a jamais
            # redemarre et continue de servir une config CORS perimee
            # indefiniment. On force donc son redemarrage (et celui de
            # config-server, source de cette config) a chaque deploiement,
            # inconditionnellement.
            docker compose restart config-server gateway
            # microservice-admin (service-admin) a deja plante une fois avec
            # une image visiblement perimee malgre un build "reussi" (login
            # 500 corrige en 5a84df1 toujours reproductible en prod des
            # heures apres le "redeploiement") - --no-cache ci-dessus force
            # une image fraiche ; le restart supplementaire ici est une
            # garantie en plus, au cas ou --build ne recreerait pas le
            # conteneur pour une raison qui reste a elucider.
            docker compose restart microservice-admin
          '

      - name: Verifier que les services sont en sante
        run: |
          ssh ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} '
            cd ~/easycom
            sleep 20
            docker compose ps
          '
